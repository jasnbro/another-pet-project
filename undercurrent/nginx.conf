server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative behind Cloudflare's HTTPS endpoint.
    absolute_redirect off;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # add_header in a location replaces inherited headers, so each location
    # repeats the security headers. The CSP only blocks framing, <base>, and
    # plugins; it does not restrict scripts or styles Astro may inline.

    # Astro fingerprints these assets; HTML and /images must revalidate.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
}

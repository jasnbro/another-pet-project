server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative behind Cloudflare's HTTPS endpoint.
    absolute_redirect off;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Astro fingerprints these assets; HTML and /images must revalidate.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

name: Undercurrent checks
on:
  push:
    branches: [main]
    paths: ['undercurrent/**', '.github/workflows/undercurrent-checks.yml']
  pull_request:
    paths: ['undercurrent/**', '.github/workflows/undercurrent-checks.yml']
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: undercurrent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:build
      - name: Check actual supplied content
        if: always()
        run: npm run validate
      - run: npm run check
      - run: npm run build
      - name: Build and smoke-test production container
        run: npm run test:container

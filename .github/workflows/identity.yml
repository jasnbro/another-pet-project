# Undercurrent identity (shared/undercurrent-identity): test the package and
# check every app's copy is in sync. Apps deploy through their own workflows.
name: Identity

on:
  pull_request:
    paths:
      - "shared/undercurrent-identity/**"
      - ".github/workflows/identity.yml"
  push:
    branches: [main]
    paths:
      - "shared/undercurrent-identity/**"
      - ".github/workflows/identity.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Package tests
        working-directory: shared/undercurrent-identity
        run: uv sync --frozen && uv run pytest -q
      - name: App copies are in sync
        run: |
          shellcheck shared/undercurrent-identity/sync.sh
          shared/undercurrent-identity/sync.sh --check gym_log

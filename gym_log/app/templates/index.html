<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Log</title>
  <meta name="description" content="Home gym workout log.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{ asset_url('css/gym-log.css') }}">
  <link rel="stylesheet" href="{{ asset_url('undercurrent/install-shortcut.css') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="{{ theme_color }}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="{{ theme_color_dark }}" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ asset_url('img/icons/icon-192.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ asset_url('img/icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#today" data-icon="dumbbell"><span>Gym Log</span></a>
    <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
    <a class="app-mark" href="https://undercurrentlabs.dev" aria-label="Undercurrent Labs"><span aria-hidden="true"></span></a>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-nav="today" data-icon="dumbbell"><span>Today</span></a>
    <a href="#plan" data-nav="plan" data-icon="calendar-check"><span>Plan</span></a>
    <a href="#exercises" data-nav="exercises" data-icon="book-open"><span>Exercises</span></a>
    <a href="#equipment" data-nav="equipment" data-icon="package"><span>Equipment</span></a>
    <a href="#history" data-nav="history" data-icon="history"><span>History</span></a>
  </nav>

  <main id="main" tabindex="-1">
    <p class="loading muted">Loading…</p>
  </main>

  <div id="timer" class="timer" hidden></div>

  {% include "_install_shortcut.html" %}
  <script src="{{ asset_url('js/icons.js') }}"></script>
  <script src="{{ asset_url('js/logic.js') }}"></script>
  <script src="{{ asset_url('js/gym-log.js') }}"></script>
  <script src="{{ asset_url('undercurrent/install-shortcut.js') }}"></script>
</body>
</html>

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # No POSTGRES_DB here on purpose -- this is a shared server ("one
      # database per application", per the repo README). Each application
      # creates its own database/role; see mindless_meals/docs/database.md
      # for how mindless_meals does it. Setting POSTGRES_DB would only
      # auto-create a single default database, which doesn't fit that.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atlas-data
    # No `ports:` -- Postgres is internal-only, reachable from other
    # containers on the atlas-data network by service name ("postgres"),
    # never from the host or LAN. See compose.dev.yml for a local-only way
    # to reach it directly (e.g. with psql) during development.

volumes:
  postgres_data:

networks:
  atlas-data:
    external: true

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` -- Postgres is internal-only, reachable from other
    # containers on the postgres_default network by service name
    # ("postgres"), never from the host or LAN. See compose.dev.yml for a
    # local-only way to reach it directly (e.g. with psql) during
    # development.

networks:
  default:
    name: postgres_default

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>another-pet-project</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7c6af7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 3rem; }
    header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 860px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.6rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
      display: block;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { font-size: 1.05rem; margin-bottom: 0.4rem; color: var(--accent); }
    .card p { font-size: 0.875rem; color: var(--muted); line-height: 1.5; }
    footer { margin-top: 4rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>another-pet-project</h1>
    <p>A collection of small projects built while falling back in love with data.</p>
  </header>
  <main class="projects">
    <a class="card" href="./mindless-meals/">
      <h2>Mindless Meals</h2>
      <p>Interactive meal planner that reduces cognitive load for dinner decisions.</p>
    </a>
  </main>
  <footer>jasnbro &middot; github.com/jasnbro/another-pet-project</footer>
</body>
</html>

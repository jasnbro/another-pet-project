services:
  mindless_meals:
    image: python:3.12-slim
    container_name: mindless_meals
    working_dir: /app
    # command: python -m http.server 8000
    command: sh -c "pip install flask && flask --app app run --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./data:/data
    restart: unless-stopped

# Curated ingredient catalog for Mindless Meals.
#
# Hand-classified from the 48 recipes in recipes.yaml (see
# mindless_meals/docs/database.md for the full methodology).
# `group` and `nutrition_type` are small fixed vocabularies (see
# INGREDIENT_GROUPS / NUTRITION_TYPES in models.py) -- both may be
# null for an ingredient this file doesn't yet cover (the importer
# adds those automatically, unclassified, when it meets a new
# ingredient name that isn't in this file yet).
#
# `aliases` covers ingredients that stand in for a choice between a
# few specific items in the original recipe text (e.g. recipes
# written as "ground turkey/beef" map to one canonical
# "Ground Meat (Any)" ingredient) so a search for "beef" still
# finds those recipes. This is an editorial merge, not a parsing
# rule -- see mindless_meals/docs/database.md for the full
# list of source phrases each merge covers.
#
# Edit this file to reclassify an ingredient or add aliases; re-run
# `flask import-ingredients` to apply changes (adds/updates only,
# never deletes -- see mindless_meals/docs/database.md).

